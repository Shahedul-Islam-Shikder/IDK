<!DOCTYPE html>
<html>
  <head>
    <title>Log In</title>
    <link rel="stylesheet" href="../CSS/login_style.css">
  </head>
  <body>
    <div class="container">
      <h1 class="heading-login">Mulingo</h1>
      <h3 class="heading-login">Log in to your account</h3>
      <form>
        <div>
          <label>Email</label>
        </div>
        <div>
          <input type="email" placeholder="username@email.com">
        </div>
        <div>
          <label>Password</label>
        </div>
        <div>
          <input type="password" placeholder="Enter Password">
        </div>
        <button>Sign in</button>
      </form>
    </div>
  </body>
</html>
