<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mulingo  |Log in</title>
  <link rel="stylesheet" href="..\CSS\login_style.css">
</head>
<body>
  <div class="container">
      <h1 class="main-title">Mulingo</h1>

      <h4 class="sub-title">Log in to your account</h4>

      <form class="login-form">

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="input-field" autocomplete="username">
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="input-field" autocomplete="current-password">
        </div>
        
        <button class="sign-in-btn" type="submit">Sign in</button>
      </form>
    </div>
</body>
</html>
