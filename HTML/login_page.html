<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mulingo  |Log in</title>
  <link rel="stylesheet" href="..\CSS\login_style.css">
</head>
<body>
  <div class="container">
      <div class="main-title-wrapper">
        <h1 class="main-title">Mulingo</h1>
      </div>

      <div class="sub-title-wrapper">
        <h4 class="sub-title">Log in to your account</h4>
      </div>

      <form class="login-form">

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="input-field" autocomplete="username">
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="input-field" autocomplete="current-password">
        </div>
        
        <button class="sign-in-btn" type="submit">Sign in</button>
      </form>
      <div>
        <p class="sign-up-text">Don't have an account? <a href="signup_page.html" class="sign-up-link">Sign up</a></p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/SplitText.min.js"></script>
    <script src="..\Script\login.js"></script>
</body>
</html>
